spring.application.name=houskytask-api
server.port=8080

# Base de datos emulada en memoria (H2)
spring.datasource.url=jdbc:h2:mem:houskytaskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web para ver tus tablas en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Creación automática de tablas según tus entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true